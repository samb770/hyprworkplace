# Workplace "@NAME@"
#
# Apply it with:  hyprworkplace apply @NAME@
# Check it with:  hyprworkplace validate @NAME@
#
# Note: only whole-line comments (# or ;) are supported, so regexes and
# commands may contain # without being cut off.
#
# Find your outputs and their supported modes with: hyprctl monitors all

[workplace]
name        = @NAME@
description = Describe this workplace in one line
# "auto" leaves monitors that are not listed below at their preferred mode,
# "disable" switches them off.
unlisted    = auto
# Optional, matches Omarchy's default of 2 on HiDPI setups.
# gdk_scale = 2
# Mark exactly one workplace with fallback = true. It is applied at login
# when none of the others matches the attached monitors.
# fallback  = true

# --------------------------------------------------------------------------
# Monitors - one section per output, named after the connector.
# --------------------------------------------------------------------------

[monitor.eDP-1]
mode     = preferred
position = 0x0
scale     = 1
# transform = 1   # 1 = 90 degrees, 3 = 270 degrees
# vrr       = 1
# enabled   = false

# [monitor.HDMI-A-1]
# mode     = 2560x1440@144
# position = 1920x0
# scale    = 1

# --------------------------------------------------------------------------
# Workspaces - which virtual desktop lives on which monitor.
# --------------------------------------------------------------------------

[workspaces]
1 = eDP-1
2 = eDP-1
3 = eDP-1

# --------------------------------------------------------------------------
# Apps - which app belongs on which workspace.
#
#   workspace   target workspace, must exist in [workspaces]
#   match       class:<regex>, title:<regex>, initialClass:<regex>
#               or initialTitle:<regex>; find values with: hyprctl clients
#   exec        command used to start the app when it is not running
#   autostart   false only moves a running window, it never launches
# --------------------------------------------------------------------------

