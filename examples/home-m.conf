# Workplace "home-m"
#
# Samsung C34J79x ultrawide centred above the laptop panel:
# x offset = (3440 - 1920) / 2 = 760

[workplace]
name        = Home M
description = Laptop with the Samsung ultrawide above it
unlisted    = auto
gdk_scale   = 2

[monitor.HDMI-A-1]
mode     = 3440x1440@59.97
position = 760x0
scale    = 1

[monitor.eDP-1]
mode     = 1920x1200
position = 760x1440
scale    = 1

[workspaces]
1 = eDP-1
2 = HDMI-A-1
3 = HDMI-A-1
4 = HDMI-A-1
5 = HDMI-A-1
6 = HDMI-A-1
