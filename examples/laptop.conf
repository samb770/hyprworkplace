# Workplace "laptop"
#
# On the road: only the built-in panel, everything else switched off.

[workplace]
name        = Laptop
description = Built-in panel only, external outputs disabled
unlisted    = disable
gdk_scale   = 2

[monitor.eDP-1]
mode     = preferred
position = 0x0
scale    = 1

[workspaces]
1 = eDP-1
2 = eDP-1
3 = eDP-1
4 = eDP-1
5 = eDP-1
6 = eDP-1
