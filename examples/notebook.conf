# Workplace "notebook"
#
# Just the laptop panel: a browser on the left two thirds, a terminal on
# the right third. 'split' pairs the two apps on workspace 1 and sets the
# tiling ratio between them; the two percentages must add up to 100.
#
#        +------------+
#        |   eDP-1    |
#        +------------+

[workplace]
name        = Notebook
description = Laptop alone, browser and terminal side by side
unlisted    = auto
gdk_scale   = 2

[monitor.eDP-1]
mode     = preferred
position = 0x0
scale    = 1

[workspaces]
1 = eDP-1

[app.browser]
workspace = 1
match     = class:^chromium$
exec      = omarchy launch browser
split     = 67

[app.terminal]
workspace = 1
match     = class:^foot$
exec      = uwsm-app -- foot
split     = 33
