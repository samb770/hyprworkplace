# Workplace "home-s"
#
# Laptop between two 1920x1200 panels:
#
#   +---------+  +---------+
#   |  DP-2   |  |HDMI-A-1 |
#   +---------+  +---------+
#        +------------+
#        |   eDP-1    |
#        +------------+

[workplace]
name        = Home S
description = Laptop with two external 1920x1200 monitors
unlisted    = auto
gdk_scale   = 2

[monitor.DP-2]
mode     = 1920x1200
position = 0x0
scale    = 1

[monitor.eDP-1]
mode     = 1920x1200
position = 800x1200
scale    = 1

[monitor.HDMI-A-1]
mode     = 1920x1200
position = 1920x0
scale    = 1

[workspaces]
1 = eDP-1
2 = DP-2
3 = HDMI-A-1
4 = HDMI-A-1
5 = HDMI-A-1
6 = HDMI-A-1

[app.terminal]
workspace = 1
match     = class:^Alacritty$
exec      = uwsm-app -- alacritty

[app.browser]
workspace = 2
match     = class:^chromium$
exec      = omarchy launch browser

[app.editor]
workspace = 3
match     = class:^Code$
autostart = false
