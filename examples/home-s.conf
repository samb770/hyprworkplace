# Workplace "home-s"
#
# Laptop between two 1920x1200 panels:
#
#   +---------+  +---------+
#   |  DP-2   |  |HDMI-A-1 |
#   +---------+  +---------+
#        +------------+
#        |   eDP-1    |
#        +------------+

[workplace]
name        = Home S
description = Laptop with two external 1920x1200 monitors
unlisted    = auto
gdk_scale   = 2

[monitor.DP-2]
mode     = 1920x1200
position = 0x0
scale    = 1

[monitor.eDP-1]
mode     = 1920x1200
position = 800x1200
scale    = 1

[monitor.HDMI-A-1]
mode     = 1920x1200
position = 1920x0
scale    = 1

# Workspace 1 is the one exception, pinned to the laptop panel. From there
# on, even workspaces live on the left monitor and odd ones on the right.
[workspaces]
1 = eDP-1
2 = DP-2
3 = HDMI-A-1
4 = DP-2
5 = HDMI-A-1
6 = DP-2
7 = HDMI-A-1
8 = DP-2
9 = HDMI-A-1

[app.terminal]
workspace = 1
match     = class:^Alacritty$
exec      = uwsm-app -- alacritty

[app.browser]
workspace = 2
match     = class:^chromium$
exec      = omarchy launch browser

[app.editor]
workspace = 3
match     = class:^Code$
autostart = false
